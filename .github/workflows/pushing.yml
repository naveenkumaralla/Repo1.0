name: Build and Store Docker Image

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # STEP 1: Log into the GitHub Container Registry automatically
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # Uses your GitHub username automatically
          password: ${{ secrets.GITHUB_TOKEN }} # A temporary password GitHub makes for you

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # STEP 2: Change "push: true" and update tags to include the registry URL
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true  # 👈 CHANGED TO TRUE: This uploads it!
          # The tag must be lowercase: ghcr.io/your-github-username/your-repo-name:latest
          tags: ghcr.io/naveenkumaralla/my-web:latest

