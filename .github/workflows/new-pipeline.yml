name: Build Docker Image

on:
  push:
    branches: [ "dev" ]

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Download your repository code onto the runner machine
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Set up the Docker Build engine on the runner
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Compile the Dockerfile into an image
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .           # Look for the Dockerfile in the root folder
          file: ../../Dockerfile   # The specific Dockerfile to use
          tags: my-web:latest
          push: false          # Keep it local on the runner for now (don't upload to a registry yet)

      # Step 4: Confirm success
      - name: Verify completion
        run: echo "Docker image compiled and verified successfully!"

