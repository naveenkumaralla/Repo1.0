# 1. Define the chronological order of your pipeline phases
stages:
  - build
  - test

# 2. This is your first automated task
compile-code-job:
  stage: build
  image: alpine:latest  # The isolated container environment where commands run
  script:
    - echo "Starting the compilation phase..."
    - mkdir build/
    - echo "Simulated Application Files" > build/app.txt
    - echo "Code successfully compiled!"

# 3. This task will run only if the build phase succeeds
run-tests-job:
  stage: test
  image: alpine:latest
  script:
    - echo "Starting automated unit tests..."
    - echo "Checking system health..."
    - sleep 3  # Simulates a real test taking a few seconds
    - echo "All tests passed successfully!"

